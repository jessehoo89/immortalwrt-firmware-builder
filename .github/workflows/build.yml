name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt Version (leave empty for latest)'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * 0'

env:
  MIRROR: "https://downloads.immortalwrt.org"
  DOCKER_REPO: "${{ secrets.DOCKER_HUB_USERNAME }}/immortalwrt_multiple_ethports"
  DOCKER_TAG: "latest"
  BUILD_DATE: "${{ github.run_number }}"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip zstd gzip tar make build-essential libssl-dev zlib1g-dev gawk git ccache libncurses5-dev libncursesw5-dev rsync python3 python3-pip python3-setuptools python3-yaml swig libpython3-dev qemu-utils genisoimage
      
      - name: Build firmware
        id: build
        run: |
          # 调用融合脚本（静默模式），输出变量供后续步骤使用
          # stdout重定向到文件（用于提取变量），stderr自然输出到GitHub Actions日志
          bash build-local.sh --batch > /tmp/build-vars.txt
          echo "=== Build variables ==="
          cat /tmp/build-vars.txt
          
          # 将关键变量注入 GitHub Actions 上下文
          source /tmp/build-vars.txt
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> $GITHUB_ENV
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV
        env:
          WORK_DIR: "${{ github.workspace }}/immortalwrt"
          OUTPUT_DIR: "${{ github.workspace }}/firmware"
          IMMORTALWRT_VERSION: "${{ github.event.inputs.version }}"
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immortalwrt-${{ steps.build.outputs.VERSION }}-${{ github.run_number }}
          name: "ImmortalWrt ${{ steps.build.outputs.VERSION }} - Build at ${{ env.BUILD_TIME }}"
          body_path: ${{ github.workspace }}/firmware/build-info.txt
          files: |
            ${{ github.workspace }}/firmware/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware-${{ steps.build.outputs.VERSION }}
          path: ${{ github.workspace }}/firmware/
          retention-days: 30
      
      - name: Prepare Docker build context
        run: |
          mkdir -p docker/openwrt
          FIRMWARE_PATH=$(find ${{ github.workspace }}/firmware -name "*x86-64-generic-rootfs.tar.gz" | head -n 1)
          if [ -z "$FIRMWARE_PATH" ]; then
            echo "Error: Firmware file not found!"
            exit 1
          fi
          cp "$FIRMWARE_PATH" docker/openwrt/
          echo "FROM scratch" > docker/openwrt/Dockerfile
          echo "ADD $(basename "$FIRMWARE_PATH") /" >> docker/openwrt/Dockerfile
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          cd docker/openwrt
          docker build -t ${{ env.DOCKER_REPO }}:${{ env.BUILD_DATE }} .
          docker push ${{ env.DOCKER_REPO }}:${{ env.BUILD_DATE }}
          docker tag ${{ env.DOCKER_REPO }}:${{ env.BUILD_DATE }} ${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
          docker push ${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
